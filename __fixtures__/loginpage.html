<script>
if(self == top) {
document.documentElement.style.display = 'block';
} else {
top.location = self.location;
}

function getObj(id)
{
return(document.getElementById(id));
}
var SetTFlag = 0;
var maxtime;
var interval;
function setTime()
{
if(window.name>=60 || window.name<0 || window.name=="")
{
maxtime = Math.min(60, 5240 + 60 - 5347);
}
else
{
maxtime = window.name;
}
if(maxtime>=0)
{
seconds = maxtime;
getObj("time").innerHTML=seconds+" secs";
if (maxtime == 0)
{
setDisable();
SetTFlag =0;
window.name="";
if(interval)
{
clearInterval(interval);
interval = 0;
}
}
else
{
--maxtime;
SetTFlag = 1;
window.name = maxtime;
}
}
}
function setinner(type)
{
if (SetTFlag ==0)
{
getObj("myLayer").style.visibility = type ;
}
}
function Transfer_meaning(id,value)
{
getObj(id).value=value;
}
</script>

<script>

getObj("username").value = "user";
var UserStr = "user";

window.name="";

function gotoRegister()
{
document.location.href="register.gch";
}
function SetDisabled()
{
getObj("errmsg").innerHTML = "You have input the wrong username or password for three times. Please try again a minute later.";
getObj("username").disabled = true;
getObj("password").disabled = true;
getObj("LoginId").disabled = true;

getObj("myLayer").style.visibility = "visible" ;
getObj("time").style.display = "" ;
interval = setInterval("setTime()",1000);
}
function setDisable()
{
if (SetTFlag == 1)
{
getObj("username").disabled = false;
getObj("password").disabled = false;
getObj("LoginId").disabled = false;

getObj("time").style.display = "none";
getObj("myLayer").style.visibility = "hidden";

}
}
function dosubmit()
{
{
getObj("LoginId").disabled = true;

getObj("Frm_Logintoken").value = "5";
document.fLogin.submit();
}
}
function doreset()
{
var HostIPAddr = "192.168.1.1";
HostIPAddr = "http:\/\/"+HostIPAddr+"\/";
document.location.href=HostIPAddr;
}
function onFocus()
{
if( document.getElementById("password").disabled == false )
{
document.getElementById("password").focus();
}
}
</script>
